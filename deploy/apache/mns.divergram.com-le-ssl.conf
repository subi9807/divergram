<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mns.divergram.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:43101/
    ProxyPassReverse / http://127.0.0.1:43101/

    ErrorLog "logs/mns.divergram.com_error.log"
    CustomLog "logs/mns.divergram.com_access.log" combined

    SSLCertificateFile /etc/letsencrypt/live/mns.divergram.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mns.divergram.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
