<VirtualHost *:80>
    ServerName partner.divergram.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:43102/
    ProxyPassReverse / http://127.0.0.1:43102/

    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog logs/partner.divergram.com-error.log
    CustomLog logs/partner.divergram.com-access.log combined
</VirtualHost>
