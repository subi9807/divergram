<VirtualHost *:80>
    ServerName mns.divergram.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:43101/
    ProxyPassReverse / http://127.0.0.1:43101/

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog "logs/mns.divergram.com_error.log"
    CustomLog "logs/mns.divergram.com_access.log" combined

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://mns.divergram.com%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
