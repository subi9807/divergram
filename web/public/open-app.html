<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#073b64" />
    <meta name="robots" content="noindex,follow" />
    <title>Open in Divergram</title>
    <link rel="stylesheet" href="/deep-link.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="page-title">
        <div class="brand"><img src="/assets/logo/divergram-logo-blue.png" alt="" /><div><strong>Divergram</strong><span>DIVE. DISCOVER. CONNECT.</span></div></div>
        <div class="art" aria-hidden="true"><span class="bubble bubble-a"></span><span class="bubble bubble-b"></span><span class="fin">DG</span></div>
        <p class="eyebrow">SHARED CONTENT</p>
        <h1 id="page-title">Continue in Divergram</h1>
        <p class="description" id="page-description">Open the shared content directly in the app.</p>
        <p class="status" id="open-status" role="status"></p>
        <div class="actions"><button class="primary" id="open-app" type="button">Open Divergram</button><a class="secondary" id="install-app" href="#">Install the app</a></div>
        <a class="web-link" href="/">Continue to Divergram.com</a>
      </section>
    </main>
    <script src="/deep-link.js" defer></script>
  </body>
</html>
